alertmanager:
  enabled: false

kube-state-metrics:
  enabled: true

prometheus-node-exporter:
  enabled: false

prometheus-pushgateway:
  enabled: false

extraScrapeConfigs: |
  - job_name: fhir-server
    scrape_interval: 15s
    kubernetes_sd_configs:
      - role: endpoints
    relabel_configs:
      - source_labels: [__meta_kubernetes_service_name]
        action: keep
        regex: fhir-server
      - source_labels: [__meta_kubernetes_endpoint_port_name]
        action: keep
        regex: http

serverFiles:
  recording_rules.yml:
    groups:
      - name: clinic_rush
        interval: 15s
        rules:
          - record: fhir:http_request_duration:p95
            expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[2m])) by (le)) or vector(0)
          - record: fhir:http_requests:rate
            expr: sum(rate(fhir_request_total[1m])) or vector(0)

server:
  extraFlags:
    - web.enable-remote-write-receiver
  retention: 6h
  persistentVolume:
    enabled: false
  service:
    type: NodePort
    nodePort: 30091
