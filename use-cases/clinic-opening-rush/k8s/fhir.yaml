apiVersion: apps/v1
kind: Deployment
metadata:
  name: fhir-server
  namespace: clinic-rush
  labels:
    app: fhir-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fhir-server
  template:
    metadata:
      labels:
        app: fhir-server
    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          command: ["sh", "-c", "until pg_isready -h postgres -U fhir -d fhirdb; do sleep 2; done"]
      containers:
        - name: fhir-server
          image: ghcr.io/wso2/fhir-server:v2.1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_URL
              value: "postgres://fhir:fhir@postgres:5432/fhirdb?sslmode=disable&pool_max_conns=10"
            - name: FHIR_CREATE_TABLES
              value: "false"
            - name: SERVER_PORT
              value: "9090"
            # Synthea bundles run up to ~40 MB; the default 60s handler bound cuts
            # large batch loads off, so give ingestion room.
            - name: SERVER_WRITE_TIMEOUT
              value: "300s"
            - name: BASE_URL
              value: "http://localhost:9090/fhir/r4"
            - name: LOG_LEVEL
              value: "info"
          ports:
            - name: http
              containerPort: 9090
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: fhir-server
  namespace: clinic-rush
  labels:
    app: fhir-server
spec:
  type: NodePort
  selector:
    app: fhir-server
  ports:
    - name: http
      port: 9090
      targetPort: http
      nodePort: 30090
