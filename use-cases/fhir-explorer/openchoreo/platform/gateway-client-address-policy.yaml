# Behind a gateway the client identity must come from the outermost hop's TCP
# socket, not from forgeable headers: Envoy emits it as x-envoy-external-address,
# which nginx forwards as X-Real-IP for the app's per-client rate limiter.
apiVersion: gateway.kgateway.dev/v1alpha1
kind: HTTPListenerPolicy
metadata:
  name: client-address
  namespace: openchoreo-data-plane
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: gateway-default
  useRemoteAddress: true
