apiVersion: openchoreo.dev/v1alpha1
kind: Workload
metadata:
  name: explorer-web-workload
  namespace: default
spec:
  owner:
    projectName: fhir-canvas-explorer
    componentName: explorer-web
  endpoints:
    http:
      type: HTTP
      port: 3000
      visibility: [project]
  dependencies:
    endpoints:
      # Declared for the cell diagram edge; the resolved address is unused
      # (the allowlist below is a literal), so bind it to a throwaway.
      - component: wso2-fhir-server
        name: http
        visibility: project
        envBindings:
          address: _
  container:
    # Bootstrap only — the build pipeline overwrites this on the first WorkflowRun.
    image: fhir-canvas-explorer/explorer-web:bootstrap
    env:
      # Short service name: wso2-fhir-server's BASE_URL embeds this origin in
      # pagination links, and workload env lands in an envFrom ConfigMap (no
      # Kubernetes $(VAR) expansion), so it must be a literal.
      - key: FHIR_ALLOWED_ORIGINS
        value: http://wso2-fhir-server:9090
      # Fresh browsers default to this via /api/config.
      - key: FHIR_DEFAULT_BASE_URL
        value: http://wso2-fhir-server:9090/fhir/r4
      - key: FHIR_MCP_IDLE_TTL_MS
        value: "300000"
