# OpenChoreo Component + Workload for care-loop-heart-risk-service.
apiVersion: openchoreo.dev/v1alpha1
kind: Component
metadata:
  name: care-loop-heart-risk-service
  namespace: default
spec:
  owner:
    projectName: default
  componentType:
    kind: ClusterComponentType
    name: deployment/service
  autoDeploy: true

---
apiVersion: openchoreo.dev/v1alpha1
kind: Workload
metadata:
  name: care-loop-heart-risk-service
  namespace: default
spec:
  owner:
    projectName: default
    componentName: care-loop-heart-risk-service
  endpoints:
    http:
      type: HTTP
      port: 8000
  container:
    image: "care-loop-heart-risk-service:openchoreo"
    # Must be loaded into the cluster's containerd before apply (deploy-components.sh does
    # this); the default IfNotPresent pull policy then uses it without a registry.
