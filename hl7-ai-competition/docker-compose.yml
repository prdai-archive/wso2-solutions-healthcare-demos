services:
  apple-healthkit-simulator:
    build:
      context: ./apple-healthkit-simulator
    image: apple-healthkit-simulator:latest
    container_name: apple-healthkit-simulator
    ports:
      - "8000:8000"
    environment:
      HEALTHKIT_DATABASE_URL: "sqlite:///./data/healthkit.db"
      # Hourly job (in-process, see src/app/vitals_forwarder.py) that forwards
      # each patient's last-hour vitals to fhir-server as FHIR Observations.
      HEALTHKIT_FHIR_SERVER_URL: "http://fhir-server:9090/fhir/r4"
    volumes:
      - healthkit-data:/app/data
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    depends_on:
      - fhir-server
    develop:
      watch:
        - path: ./apple-healthkit-simulator/pyproject.toml
          action: rebuild
        - path: ./apple-healthkit-simulator/uv.lock
          action: rebuild
        - path: ./apple-healthkit-simulator/src
          action: rebuild

  care-loop-heart-risk-service:
    build:
      context: ./care-loop-heart-risk-service
    image: care-loop-heart-risk-service:latest
    container_name: care-loop-heart-risk-service
    ports:
      - "8002:8000"
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    develop:
      watch:
        - path: ./care-loop-heart-risk-service/pyproject.toml
          action: rebuild
        - path: ./care-loop-heart-risk-service/uv.lock
          action: rebuild
        - path: ./care-loop-heart-risk-service/src
          action: rebuild

  whatsapp-simulator:
    build:
      context: ./whatsapp-simulator
    image: whatsapp-simulator:latest
    container_name: whatsapp-simulator
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
    healthcheck:
      test:
        - "CMD"
        - "bun"
        - "-e"
        - "fetch('http://localhost:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    develop:
      watch:
        - path: ./whatsapp-simulator/package.json
          action: rebuild
        - path: ./whatsapp-simulator/bun.lock
          action: rebuild
        - path: ./whatsapp-simulator/next.config.ts
          action: rebuild
        - path: ./whatsapp-simulator/src
          action: rebuild

  fhir-server-db:
    image: postgres:16-alpine
    container_name: fhir-server-db
    environment:
      POSTGRES_DB: fhirdb
      POSTGRES_USER: fhir
      POSTGRES_PASSWORD: fhir
    volumes:
      - fhir-server-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fhir -d fhirdb"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # WSO2 FHIR R4 server (github.com/wso2/fhir-server): Go + Postgres, no auth of
  # its own (see its README's Multi-Tenancy/Security note) - fine for a local
  # demo, put a gateway/auth proxy in front for anything real.
  fhir-server:
    build:
      context: "https://github.com/wso2/fhir-server.git#v0.5.0"
    image: care-loop/fhir-server:v0.5.0
    container_name: fhir-server
    ports:
      - "9090:9090"
    environment:
      DATABASE_URL: "postgres://fhir:fhir@fhir-server-db:5432/fhirdb?sslmode=disable"
      FHIR_CREATE_TABLES: "true"
      SERVER_PORT: "9090"
      BASE_URL: "http://localhost:9090/fhir/r4"
    depends_on:
      fhir-server-db:
        condition: service_healthy
    restart: unless-stopped

  # FHIR R4 -> MCP bridge in front of fhir-server. No token needed: fhir-server
  # has no auth of its own (see above), so FHIR_SERVER_DISABLE_AUTHORIZATION is
  # the documented way to point the bridge at a publicly-accessible FHIR server.
  fhir-mcp-server:
    # Built from the pinned upstream tag rather than the published image, which
    # is arm64-only; building uses $TARGETPLATFORM so it works on any host arch.
    build:
      context: "https://github.com/wso2/fhir-mcp-server.git#0.10.0"
    image: care-loop/fhir-mcp-server:0.10.0
    container_name: fhir-mcp-server
    ports:
      - "8001:8000"
    environment:
      FHIR_MCP_HOST: 0.0.0.0
      FHIR_MCP_PORT: 8000
      FHIR_SERVER_BASE_URL: "http://fhir-server:9090/fhir/r4"
      FHIR_SERVER_DISABLE_AUTHORIZATION: "True"
    depends_on:
      - fhir-server
    restart: unless-stopped

  front-desk-dashboard:
    build:
      context: ./front-desk-dashboard
    image: front-desk-dashboard:latest
    container_name: front-desk-dashboard
    ports:
      - "3002:3002"
    environment:
      NODE_ENV: production
    healthcheck:
      test:
        - "CMD"
        - "bun"
        - "-e"
        - "fetch('http://localhost:3002/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    develop:
      watch:
        - path: ./front-desk-dashboard/package.json
          action: rebuild
        - path: ./front-desk-dashboard/bun.lock
          action: rebuild
        - path: ./front-desk-dashboard/next.config.ts
          action: rebuild
        - path: ./front-desk-dashboard/src
          action: rebuild

volumes:
  healthkit-data:
  fhir-server-db:
