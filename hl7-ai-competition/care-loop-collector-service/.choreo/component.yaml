# OpenChoreo component definition for care-loop-collector-service.
apiVersion: openchoreo.dev/v1alpha1
kind: Component
metadata:
  name: care-loop-collector-service
  namespace: default
spec:
  owner:
    projectName: default

  autoDeploy: true
  componentType:
    kind: ClusterComponentType
    name: deployment/service

---

apiVersion: openchoreo.dev/v1alpha1
kind: Workload
metadata:
  name: care-loop-collector-service
  namespace: default
spec:
  owner:
    componentName: care-loop-collector-service
    projectName: default
  endpoints:
    http:
      type: HTTP
      port: 8004
      # "internal" visibility requires gateway.ingress.internal on the Environment/DataPlane,
      # which this single-cluster install doesn't configure - the release fails to render.
      visibility: [project]
  container:
    # Must be loaded into the cluster's containerd before apply (deploy-components.sh does
    # this); there is no registry for this image.
    image: care-loop-collector-service:openchoreo
    # This service reads its endpoint URLs from Config.toml-backed configurable variables
    # (config.bal), not container env vars, so the envBindings below don't wire anything at
    # runtime - this mounted Config.toml is what actually does. Short in-namespace service
    # names are deliberate: the fully-qualified addresses envBindings injects resolved
    # intermittently under this cluster's DNS (see openchoreo/README.md).
    files:
      - key: Config.toml
        mountPath: /home/ballerina
        value: |
          listenPort = 8004
          aiServiceUrl = "http://care-loop-ai-service:8003"
          fhirServerUrl = "http://care-loop-fhir-server:8080/fhir"
          whatsappUrl = "http://whatsapp-simulator:3000"
          collectorPublicUrl = "http://care-loop-collector-service:8004"
          analysisServiceUrl = "http://care-loop-analysis-service:8005"
  # Per docker-compose.yml depends_on for care-loop-collector-service. These edges are for
  # OpenChoreo's dependency model; the runtime wiring happens via the Config.toml above.
  dependencies:
    endpoints:
      - component: care-loop-ai-service
        name: http
        visibility: project
        envBindings:
          address: AI_SERVICE_URL
      - component: care-loop-fhir-server
        name: http
        visibility: project
        envBindings:
          address: FHIR_SERVER_URL
      - component: whatsapp-simulator
        name: http
        visibility: project
        envBindings:
          address: WHATSAPP_URL
