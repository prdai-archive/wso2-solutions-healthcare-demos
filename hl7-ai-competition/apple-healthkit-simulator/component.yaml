apiVersion: openchoreo.dev/v1alpha1
kind: Component
metadata:
  name: apple-healthkit-simulator
  namespace: default
spec:
  owner:
    projectName: default
  componentType:
    kind: ClusterComponentType
    name: deployment/service
  autoDeploy: true

---

# The image below must be loaded into the cluster's containerd before apply
# (openchoreo/deploy-components.sh does this); there is no registry for it.
apiVersion: openchoreo.dev/v1alpha1
kind: Workload
metadata:
  name: apple-healthkit-simulator
  namespace: default
spec:
  owner:
    projectName: default
    componentName: apple-healthkit-simulator
  container:
    image: "apple-healthkit-simulator:openchoreo"
    env:
      # Mirrors docker-compose.yml: without a target URL the vitals-cron forwarder is a no-op
      # (Settings.vitals_target_url defaults to None), so no vitals would ever reach the
      # collector on OpenChoreo. Demo-speed cadence matches compose (real default is hourly).
      - key: HEALTHKIT_VITALS_TARGET_URL
        value: "http://care-loop-collector-service:8004/vitals"
      - key: HEALTHKIT_VITALS_FORWARD_INTERVAL_HOURS
        value: "0.1"
  endpoints:
    http:
      type: HTTP
      port: 8000
      visibility: [external]
