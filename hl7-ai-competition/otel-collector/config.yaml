receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  # Stamp OpenChoreo identity so the AMP observer scopes these traces to the
  # registered external agent (its org/project/agent trace view filters on
  # these resource attributes). Values are AMP-instance specific and injected
  # via env by amp-init; empty values leave the traces unscoped but still stored.
  resource/openchoreo:
    attributes:
      - key: openchoreo.dev/project-uid
        value: ${env:OC_PROJECT_UID}
        action: upsert
      - key: openchoreo.dev/component-uid
        value: ${env:OC_COMPONENT_UID}
        action: upsert
      - key: openchoreo.dev/environment-uid
        value: ${env:OC_ENVIRONMENT_UID}
        action: upsert
      - key: openchoreo.dev/namespace
        value: ${env:OC_NAMESPACE}
        action: upsert

exporters:
  otlphttp/amp:
    # Base URL of the AMP otel ingest; the exporter appends /v1/traces.
    endpoint: ${env:AMP_OTEL_ENDPOINT}
    headers:
      x-amp-api-key: ${env:AMP_AGENT_API_KEY}

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [resource/openchoreo]
      exporters: [otlphttp/amp]
