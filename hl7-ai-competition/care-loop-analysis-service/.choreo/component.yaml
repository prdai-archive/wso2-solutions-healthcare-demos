# OpenChoreo Component + Workload for care-loop-analysis-service.
# Schema verified against https://openchoreo.dev/docs/reference/api/application/component/
# and https://openchoreo.dev/docs/reference/api/application/workload/ (accessed 2026-07-08).
# NOTE: image, port, and dependency-endpoint references live on the Workload CR, not the
# Component CR — the Component CR only carries owner/componentType/autoDeploy/parameters/traits.
apiVersion: openchoreo.dev/v1alpha1
kind: Component
metadata:
  name: care-loop-analysis-service
  namespace: default
spec:
  owner:
    projectName: default
  componentType:
    kind: ClusterComponentType
    name: deployment/service
  autoDeploy: true
  parameters:
    # Locally-built image already loaded into the cluster's containerd (kind load / ctr images
    # import) rather than pulled from a registry — verified against the react-starter and
    # go-docker-greeter samples in openchoreo/openchoreo (release-v1.1).
    imagePullPolicy: Never

---
apiVersion: openchoreo.dev/v1alpha1
kind: Workload
metadata:
  name: care-loop-analysis-service
  namespace: default
spec:
  owner:
    projectName: default
    componentName: care-loop-analysis-service
  container:
    image: care-loop-analysis-service:openchoreo
    # This service reads its endpoint URLs from Config.toml-backed configurable variables
    # (config.bal), not container env vars, so the envBindings below don't wire anything at
    # runtime - this mounted Config.toml is what actually does. Short in-namespace service
    # names are deliberate: the fully-qualified addresses envBindings injects resolved
    # intermittently under this cluster's DNS (see openchoreo/README.md).
    files:
      - key: Config.toml
        mountPath: /home/ballerina
        value: |
          listenPort = 8005
          fhirServerUrl = "http://care-loop-fhir-server:8080/fhir"
          ehrFhirServerUrl = "http://ehr-fhir-server:9090/fhir/r4"
          heartRiskServiceUrl = "http://care-loop-heart-risk-service:8000"
          aiServiceUrl = "http://care-loop-ai-service:8003"
          collectorServiceUrl = "http://care-loop-collector-service:8004"
          mlEscalationThreshold = 0.5
          agenticEscalationThreshold = 0.5
          questionnaireTimeoutHours = 4
  endpoints:
    http:
      type: HTTP
      port: 8005
      visibility: [project]
  # Five dependency edges per this service's actual docker-compose.yml depends_on
  # (care-loop-heart-risk-service, care-loop-fhir-server, ehr-fhir-server, care-loop-ai-service,
  # care-loop-collector-service). All Workloads in this migration use endpoint name "http".
  # These edges are for OpenChoreo's dependency model; the runtime wiring happens via the
  # Config.toml above.
  dependencies:
    endpoints:
      - component: care-loop-heart-risk-service
        name: http
        visibility: project
        envBindings:
          address: HEART_RISK_SERVICE_URL
      - component: care-loop-fhir-server
        name: http
        visibility: project
        envBindings:
          address: FHIR_SERVER_URL
      - component: ehr-fhir-server
        name: http
        visibility: project
        envBindings:
          address: EHR_FHIR_SERVER_URL
      - component: care-loop-ai-service
        name: http
        visibility: project
        envBindings:
          address: AI_SERVICE_URL
      - component: care-loop-collector-service
        name: http
        visibility: project
        envBindings:
          address: COLLECTOR_SERVICE_URL
