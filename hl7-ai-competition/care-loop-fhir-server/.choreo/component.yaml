# OpenChoreo Component + Workload for care-loop-fhir-server (HAPI FHIR).
apiVersion: openchoreo.dev/v1alpha1
kind: Component
metadata:
  name: care-loop-fhir-server
  namespace: default
spec:
  owner:
    projectName: default
  autoDeploy: true
  componentType:
    kind: ClusterComponentType
    name: deployment/service
  # The "service" ClusterComponentType defaults containers to 256Mi, which OOM-kills HAPI.
  # NOTE: this parameters block does NOT reach the rendered Deployment in OpenChoreo v1.1 -
  # deploy-components.sh patches the ReleaseBinding's componentTypeEnvironmentConfigs, which
  # is what the renderer actually consumes. Kept as a declaration of intent.
  parameters:
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi

---

# Uses the public hapiproject/hapi image (no local build); deploy-components.sh still
# pre-loads it into the cluster's containerd.
apiVersion: openchoreo.dev/v1alpha1
kind: Workload
metadata:
  name: care-loop-fhir-server
  namespace: default
spec:
  owner:
    projectName: default
    componentName: care-loop-fhir-server
  container:
    image: "hapiproject/hapi:v8.10.0-2"
    env:
      - key: hapi.fhir.fhir_version
        value: "R4"
  endpoints:
    http:
      type: HTTP
      port: 8080
      visibility: [project]
