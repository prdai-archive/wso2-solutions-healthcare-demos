# ClusterTrait: http-route-timeout — sets a request timeout on the component's
# HTTPRoute; Envoy's 15s default otherwise cuts off the long chat tool loop.
apiVersion: openchoreo.dev/v1alpha1
kind: ClusterTrait
metadata:
  name: http-route-timeout
spec:
  parameters:
    openAPIV3Schema:
      type: object
      properties:
        request:
          type: string
          default: "75s"
          description: "Gateway request timeout (Gateway API duration, e.g. 75s)"
  patches:
    - target:
        group: gateway.networking.k8s.io
        version: v1
        kind: HTTPRoute
      operations:
        - op: add
          path: /spec/rules/0/timeouts
          value:
            request: ${parameters.request}
