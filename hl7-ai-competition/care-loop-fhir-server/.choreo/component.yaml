apiVersion: openchoreo.dev/v1alpha1
kind: Component
metadata:
  name: care-loop-fhir-server
  namespace: default
spec:
  owner:
    projectName: default
  autoDeploy: true
  componentType:
    kind: ClusterComponentType
    name: deployment/service

---

# Public hapi image, still pre-loaded into containerd by deploy-components.sh.
apiVersion: openchoreo.dev/v1alpha1
kind: Workload
metadata:
  name: care-loop-fhir-server
  namespace: default
spec:
  owner:
    projectName: default
    componentName: care-loop-fhir-server
  container:
    image: "hapiproject/hapi:v8.10.0-2"
    env:
      - key: hapi.fhir.fhir_version
        value: "R4"
  endpoints:
    http:
      type: HTTP
      port: 8080
      visibility: [project]
