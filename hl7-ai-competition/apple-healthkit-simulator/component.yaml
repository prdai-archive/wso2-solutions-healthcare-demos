apiVersion: openchoreo.dev/v1alpha1
kind: Component
metadata:
  name: apple-healthkit-simulator
  namespace: default
spec:
  owner:
    projectName: default
  componentType:
    kind: ClusterComponentType
    name: deployment/service
  autoDeploy: true

---

# TODO: the current OpenChoreo Component/Workload API (openchoreo.dev/docs/reference/api/application/{component,workload}/,
# v1.1.x) has no imagePullPolicy field anywhere in the schema, so "parameters.imagePullPolicy: Never" as described in the
# spike cannot be expressed here without inventing syntax. This Workload assumes the local tag below is loaded into the
# cluster's containerd out-of-band (e.g. kind load docker-image) before apply; if OpenChoreo actually needs an explicit
# pull-policy override for that to work, it isn't documented and needs to be confirmed against the installed version.
apiVersion: openchoreo.dev/v1alpha1
kind: Workload
metadata:
  name: apple-healthkit-simulator
  namespace: default
spec:
  owner:
    projectName: default
    componentName: apple-healthkit-simulator
  container:
    image: "apple-healthkit-simulator:openchoreo"
    env:
      # Mirrors docker-compose.yml: without a target URL the vitals-cron forwarder is a no-op
      # (Settings.vitals_target_url defaults to None), so no vitals would ever reach the
      # collector on OpenChoreo. Demo-speed cadence matches compose (real default is hourly).
      - key: HEALTHKIT_VITALS_TARGET_URL
        value: "http://care-loop-collector-service:8004/vitals"
      - key: HEALTHKIT_VITALS_FORWARD_INTERVAL_HOURS
        value: "0.1"
  endpoints:
    http:
      type: HTTP
      port: 8000
      visibility: [external]
  # docker-compose.yml declares no depends_on for apple-healthkit-simulator, so there are no dependency edges to
  # declare here. Note also that dependencies live on the Workload (spec.dependencies.endpoints), not on the
  # Component CR itself - the schema has no Component-level dependency/connection field, so an edge from this
  # component onto another (e.g. its runtime calls to care-loop-collector-service via HEALTHKIT_VITALS_TARGET_URL)
  # would need to be added here as a WorkloadConnection if/when that call should be modeled as a typed dependency.
