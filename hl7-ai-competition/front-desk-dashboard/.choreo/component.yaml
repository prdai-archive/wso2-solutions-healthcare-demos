# OpenChoreo Component + Workload definition for front-desk-dashboard.
apiVersion: openchoreo.dev/v1alpha1
kind: Component
metadata:
  name: front-desk-dashboard
  namespace: default
spec:
  owner:
    projectName: default
  componentType:
    kind: ClusterComponentType
    name: deployment/service
  autoDeploy: true
  parameters:
    # NOTE: parameters do not reach the rendered Deployment in OpenChoreo v1.1; the local
    # image works because deploy-components.sh pre-loads it and IfNotPresent skips the pull.
    imagePullPolicy: Never

---
apiVersion: openchoreo.dev/v1alpha1
kind: Workload
metadata:
  name: front-desk-dashboard
  namespace: default
spec:
  owner:
    projectName: default
    componentName: front-desk-dashboard
  container:
    # Must be loaded into the cluster's containerd before apply (deploy-components.sh does this).
    image: front-desk-dashboard:openchoreo
  endpoints:
    http:
      type: HTTP
      port: 3002
      visibility: [project]
  dependencies:
    endpoints:
      # The nginx read-only proxy from docker-compose has no Component here, so this points
      # at care-loop-fhir-server directly. envBindings.address names match the env vars the
      # app reads (docker-compose.yml environment block).
      - component: ehr-fhir-server
        name: http
        visibility: project
        envBindings:
          address: EHR_FHIR_SERVER_URL
      - component: care-loop-fhir-server
        name: http
        visibility: project
        envBindings:
          address: CARE_LOOP_FHIR_SERVER_URL
