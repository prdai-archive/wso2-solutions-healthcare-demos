openapi: 3.0.3
info:
  title: care-loop-questionnaire-agent
  version: 0.1.0
paths:
  /questionnaires:
    post:
      summary: Draft a FHIR Questionnaire for a patient's recent vitals
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [patientId]
              properties:
                patientId:
                  type: string
      responses:
        "201":
          description: Drafted questionnaire
          content:
            application/json:
              schema:
                type: object
                properties:
                  questionnaire:
                    type: object
        "500":
          description: Agent failure
