apiVersion: openchoreo.dev/v1alpha1
kind: Component
metadata:
  name: explorer-web
  namespace: default
  annotations:
    openchoreo.dev/display-name: Explorer Web App
    openchoreo.dev/description: Next.js UI and API routes with the embedded FHIR MCP subprocess.
spec:
  owner:
    projectName: fhir-canvas-explorer
  componentType:
    kind: ClusterComponentType
    name: deployment/service
  autoDeploy: true
  # LLM calls go east-west through the WSO2 AI gateway (see platform/ai-gateway):
  # the trait injects OPENAI_BASE_URL, keeps the credential at the gateway, and
  # enforces a per-user spend budget keyed on the forwarded fingerprint/tenant.
  traits:
    - kind: ClusterTrait
      name: ai-user-cost-budget
      instanceName: llm
      parameters:
        providerRef: openai-provider
        budgetUsd: 1.5
        window: "168h"
  workflow:
    kind: ClusterWorkflow
    name: dockerfile-builder
    parameters:
      repository:
        # Dev fork/branch. At merge, flip both to this repo's main:
        #   url -> https://github.com/nirmal070125/fhir-canvas-explorer-df47329f
        #   branch -> main
        url: "https://github.com/prdai-archive/wso2-fhir-canvas-explorer-df47329f"
        revision:
          branch: "feat/openchoreo-deployment"
        appPath: "/"
      docker:
        context: "/"
        filePath: "/Dockerfile"
---
# Triggers the initial build so `setup.sh` is end-to-end; the build wires the
# image into the Workload and autoDeploy rolls it out. Bump -01 to rebuild.
apiVersion: openchoreo.dev/v1alpha1
kind: WorkflowRun
metadata:
  name: explorer-web-build-01
  namespace: default
  labels:
    openchoreo.dev/project: fhir-canvas-explorer
    openchoreo.dev/component: explorer-web
spec:
  workflow:
    kind: ClusterWorkflow
    name: dockerfile-builder
    parameters:
      repository:
        url: "https://github.com/prdai-archive/wso2-fhir-canvas-explorer-df47329f"
        revision:
          branch: "feat/openchoreo-deployment"
        appPath: "/"
      docker:
        context: "/"
        filePath: "/Dockerfile"
