# OpenChoreo Component + Workload for care-loop-ai-service.
apiVersion: openchoreo.dev/v1alpha1
kind: Component
metadata:
  name: care-loop-ai-service
  namespace: default
spec:
  owner:
    projectName: default

  componentType:
    kind: ClusterComponentType
    name: deployment/service
  autoDeploy: true

---

apiVersion: openchoreo.dev/v1alpha1
kind: Workload
metadata:
  name: care-loop-ai-service
  namespace: default
spec:
  owner:
    componentName: care-loop-ai-service
    projectName: default
  endpoints:
    http:
      type: HTTP
      port: 8003
  # Once a Config.toml is mounted (needed for openAiApiKey), Ballerina stops honoring the
  # separate env-var override for other configurables, so fhirMcpUrl must be set inside the
  # mounted Config.toml. Short in-namespace service names are deliberate - the FQDN that
  # envBindings injects resolved intermittently under this cluster's DNS (see openchoreo/README.md).
  dependencies:
    endpoints:
      - project: default
        component: fhir-mcp-server
        name: http
        visibility: project
        envBindings:
          # Recorded for OpenChoreo's dependency graph; the actual value used at runtime is the
          # fhirMcpUrl line in Config.toml below, not this env var (see note above).
          address: FHIR_MCP_SERVER_URL_UNUSED
  container:
    image: "care-loop-ai-service:openchoreo"
    # mountPath must be the directory; "key" becomes the filename (mounting at the full file
    # path yields a directory, since the ConfigMap volume always targets a directory).
    # openAiApiKey must be replaced with a real key via a live Secret (see openchoreo/README.md)
    # - never commit a real key here.
    files:
      - key: Config.toml
        mountPath: /home/ballerina
        value: |
          listenPort = 8003
          fhirMcpUrl = "http://fhir-mcp-server:8000/mcp"
          openAiApiKey = "placeholder-not-a-real-key"
