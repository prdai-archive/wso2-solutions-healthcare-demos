# OpenChoreo Component + Workload definition for whatsapp-simulator (see docker-compose.yml).
# NOTE: Component.spec.parameters does not reach the rendered Deployment in OpenChoreo v1.1;
# the locally-loaded image works because deploy-components.sh pre-loads it into containerd and
# the default IfNotPresent policy then skips the pull.
apiVersion: openchoreo.dev/v1alpha1
kind: Component
metadata:
  name: whatsapp-simulator
  namespace: default
spec:
  owner:
    projectName: default
  autoDeploy: true
  componentType:
    kind: ClusterComponentType
    name: deployment/service
  parameters:
    imagePullPolicy: Never

---

apiVersion: openchoreo.dev/v1alpha1
kind: Workload
metadata:
  name: whatsapp-simulator
  namespace: default
spec:
  owner:
    projectName: default
    componentName: whatsapp-simulator
  container:
    # Must be loaded into the cluster's containerd before apply (deploy-components.sh does this).
    image: whatsapp-simulator:openchoreo
  endpoints:
    http:
      type: HTTP
      port: 3000
      visibility: [external]
