# Builds the LlmProvider's credential Secret from the OpenBao entry that
# seed-secrets.sh writes; the template adds the Bearer prefix the provider's
# Authorization header expects. The app itself no longer receives the key.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openai-provider-auth
  namespace: openchoreo-data-plane
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: default
  target:
    name: openai-provider-auth
    template:
      data:
        authorization: "Bearer {{ .apiKey }}"
  data:
    - secretKey: apiKey
      remoteRef:
        key: fhir-canvas-explorer-openai-api-key
        property: value
